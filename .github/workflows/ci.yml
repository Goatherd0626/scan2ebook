name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: 秘密扫描 (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  native-engine:
    name: macOS 原生转换引擎
    # 原生测试在 arm64 上编译，并使用系统 PDFKit 和 Vision。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 自制 PDF 与回环模拟模型测试
        run: python3 desktop/engine/tests/run.py

  reader:
    name: 网页阅读器(测试 / 构建 / 打包)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: reader/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单元测试(jsdom)
        run: npm test
      - name: 前端构建
        run: npm run build
      - name: npm 包内容检查
        run: npm run test:package
