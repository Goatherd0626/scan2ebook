<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scan2ebook 阅读器</title>
</head>
<body data-mode="split">

<header id="topbar">
  <div id="topbar-leading" class="toolbar-group">
    <button id="btn-library" class="icon-btn" title="显示或隐藏左侧栏" aria-label="显示或隐藏左侧栏" aria-pressed="true"><span class="sf i-sidebar-left"></span></button>
  </div>
  <div id="topbar-document" class="toolbar-group">
    <div id="tabs">
      <span id="tabs-empty">未打开书籍</span>
    </div>
  </div>
  <div id="topbar-right">
    <div id="topbar-context" class="toolbar-group">
      <div id="plugin-toolbar"></div>
    </div>
    <div id="topbar-trailing" class="toolbar-group">
      <button id="btn-settings" class="icon-btn" title="设置 / 插件" aria-label="设置 / 插件">
        <span class="sf i-gear"></span>
      </button>
      <button id="btn-import" class="icon-btn text-btn" title="导入 .s2e 电子书包">
        <span class="sf i-upload"></span> 导入
      </button>
    </div>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="library-panel" class="side-panel">
      <div class="panel-head">
        <span class="panel-title">书库</span>
        <span class="panel-actions">
          <button id="btn-import-lib" class="mini act" title="导入电子书" aria-label="导入电子书">
            <span class="sf i-upload"></span>
          </button>
          <button id="btn-new-folder" class="mini act" title="新建文件夹" aria-label="新建文件夹">
            <span class="sf i-folder"></span>
          </button>
        </span>
      </div>
      <div id="library-tree" class="panel-body"></div>
    </div>
    <div id="toc-panel" class="side-panel">
      <div class="panel-head">
        <span class="panel-title">目录</span>
        <span class="seg" id="toc-tabs">
          <button data-tt="toc" class="active">目录</button>
        </span>
      </div>
      <div id="toc-list" class="panel-body"></div>
    </div>
    <div id="sidebar-resizer" class="layout-resizer" role="separator" aria-orientation="vertical"
         aria-label="调整侧边栏宽度" aria-valuemin="180" aria-valuemax="480" tabindex="0"></div>
  </aside>

  <main id="workspace"></main>
</div>

<div id="fn-tooltip"></div>
<div id="toast"></div>

<div id="settings-mask" hidden></div>
<div id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="sd-title" hidden>
  <div class="sd-head">
    <span class="sd-title" id="sd-title">设置 / 插件</span>
    <button id="sd-close" class="icon-btn" title="关闭" aria-label="关闭"><span class="sf i-xmark"></span></button>
  </div>
  <div id="sd-sections"></div>
</div>

<input type="file" id="import-input" accept=".s2e,.zip" multiple hidden>

<script type="module" src="/src/main.js"></script>
</body>
</html>
