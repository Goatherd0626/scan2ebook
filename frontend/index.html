<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scan2ebook 阅读器</title>
</head>
<body data-mode="split">

<header id="topbar">
  <button id="btn-library" class="icon-btn" title="书库 (1)" aria-label="书库">📚</button>
  <div id="tabs">
    <span id="tabs-empty">未打开书籍</span>
  </div>
  <div id="topbar-right">
    <div class="tb-group" id="view-mode-group">
      <div id="view-modes" class="seg" role="tablist">
        <button data-mode="split" class="active" title="双栏视图">⬛ 双栏</button>
        <button data-mode="pdf" title="仅 PDF">▤ PDF</button>
        <button data-mode="text" title="仅文字">▥ 文字</button>
      </div>
      <button id="btn-spread" class="icon-btn" title="PDF 双页摊开">📖</button>
      <button id="btn-sync" class="icon-btn" title="同步滚动">⇅</button>
    </div>
    <div class="tb-group" id="plugin-toolbar"></div>
    <div class="tb-group">
      <button id="btn-settings" class="icon-btn" title="设置 / 插件">⚙</button>
      <button id="btn-import" class="icon-btn text-btn" title="导入 .s2e 电子书包">⬆ 导入</button>
    </div>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="library-panel" class="side-panel">
      <div class="panel-head">
        <span class="panel-title">书库</span>
        <span class="panel-actions">
          <button id="btn-import-lib" class="mini" title="导入电子书" aria-label="导入电子书">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9.8V2"/><path d="M5.2 4.6 8 1.8l2.8 2.8"/><path d="M2.8 6.6v6a1.2 1.2 0 0 0 1.2 1.2h8a1.2 1.2 0 0 0 1.2-1.2v-6"/></svg>
          </button>
          <button id="btn-new-folder" class="mini" title="新建文件夹" aria-label="新建文件夹">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M1.7 4A1.2 1.2 0 0 1 2.9 2.8h2.7l1.5 1.9h5.9A1.2 1.2 0 0 1 14.2 5.9v5.9A1.2 1.2 0 0 1 13 13H2.9a1.2 1.2 0 0 1-1.2-1.2V4z"/><circle cx="12" cy="12.5" r="3.1"/><path d="M12 11.3v2.4M10.8 12.5h2.4"/></svg>
          </button>
          <button id="btn-batch" class="mini" title="多选" aria-label="多选">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="2.2" cy="3.8" r=".9" fill="currentColor" stroke="none"/><path d="M5.5 3.8h8.3"/><circle cx="2.2" cy="8" r=".9" fill="currentColor" stroke="none"/><path d="M5.5 8h8.3"/><circle cx="2.2" cy="12.2" r=".9" fill="currentColor" stroke="none"/><path d="M5.5 12.2h8.3"/></svg>
          </button>
        </span>
      </div>
      <div id="library-tree" class="panel-body"></div>
    </div>
    <div id="toc-panel" class="side-panel">
      <div class="panel-head">
        <span class="panel-title">目录</span>
        <span class="seg" id="toc-tabs">
          <button data-tt="toc" class="active">目录</button>
        </span>
      </div>
      <div id="toc-list" class="panel-body"></div>
    </div>
  </aside>

  <main id="workspace"></main>
</div>

<div id="fn-tooltip"></div>
<div id="toast"></div>

<div id="settings-mask" hidden></div>
<div id="settings-dialog" hidden>
  <div class="sd-head">
    <span class="sd-title">设置 / 插件</span>
    <button id="sd-close" class="mini" title="关闭">✕</button>
  </div>
  <div id="sd-sections"></div>
</div>

<input type="file" id="import-input" accept=".s2e,.zip" multiple hidden>

<script type="module" src="/src/main.js"></script>
</body>
</html>
