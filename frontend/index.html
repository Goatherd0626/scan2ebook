<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scan2ebook 阅读器</title>
</head>
<body data-mode="split">

<header id="topbar">
  <button id="btn-library" class="icon-btn" title="书库 (1)" aria-label="书库">📚</button>
  <div id="tabs">
    <span id="tabs-empty">未打开书籍</span>
  </div>
  <div id="topbar-right">
    <div class="tb-group" id="view-mode-group">
      <div id="view-modes" class="seg" role="tablist">
        <button data-mode="split" class="active" title="双栏视图">⬛ 双栏</button>
        <button data-mode="pdf" title="仅 PDF">▤ PDF</button>
        <button data-mode="text" title="仅文字">▥ 文字</button>
      </div>
      <button id="btn-spread" class="icon-btn" title="PDF 双页摊开">📖</button>
      <button id="btn-sync" class="icon-btn" title="同步滚动">⇅</button>
    </div>
    <div class="tb-group" id="plugin-toolbar"></div>
    <div class="tb-group">
      <button id="btn-settings" class="icon-btn" title="设置 / 插件">⚙</button>
      <button id="btn-import" class="icon-btn text-btn" title="导入 .s2e 电子书包">⬆ 导入</button>
    </div>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="library-panel" class="side-panel">
      <div class="panel-head">
        <span class="panel-title">书库</span>
        <span class="panel-actions">
          <button id="btn-import-lib" class="mini" title="导入电子书">⬆</button>
          <button id="btn-new-folder" class="mini" title="新建文件夹">＋</button>
          <button id="btn-batch" class="mini" title="批量管理">☑</button>
        </span>
      </div>
      <div id="library-tree" class="panel-body"></div>
    </div>
    <div id="toc-panel" class="side-panel">
      <div class="panel-head">
        <span class="panel-title">目录</span>
        <span class="seg" id="toc-tabs">
          <button data-tt="toc" class="active">目录</button>
        </span>
      </div>
      <div id="toc-list" class="panel-body"></div>
    </div>
  </aside>

  <main id="workspace"></main>
</div>

<div id="fn-tooltip"></div>
<div id="toast"></div>

<div id="settings-mask" hidden></div>
<div id="settings-dialog" hidden>
  <div class="sd-head">
    <span class="sd-title">设置 / 插件</span>
    <button id="sd-close" class="mini" title="关闭">✕</button>
  </div>
  <div id="sd-sections"></div>
</div>

<div id="meta-mask" hidden></div>
<div id="meta-dialog" hidden>
  <div class="sd-head">
    <span class="sd-title">编辑书籍信息</span>
    <button id="meta-close" class="mini" title="关闭">✕</button>
  </div>
  <div id="meta-form">
    <label>书名 <input id="mf-title" type="text"></label>
    <label>作者 <input id="mf-author" type="text"></label>
    <label>出版社 <input id="mf-publisher" type="text"></label>
    <label>版次 <input id="mf-edition" type="text"></label>
    <label>ISBN <input id="mf-isbn" type="text"></label>
    <label>文件夹 <select id="mf-folder"></select></label>
    <div class="mf-actions">
      <button id="mf-cancel" class="mini">取消</button>
      <button id="mf-save" class="mini primary">保存</button>
    </div>
  </div>
</div>
<input type="file" id="import-input" accept=".s2e,.zip" multiple hidden>

<script type="module" src="/src/main.js"></script>
</body>
</html>
