<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scan2ebook 阅读器</title>
</head>
<body data-mode="split">

<header id="topbar">
  <button id="btn-library" class="icon-btn" title="书库">📚</button>
  <div id="tabs"></div>
  <div id="topbar-right">
    <div id="view-modes" class="seg">
      <button data-mode="split" class="active">双栏</button>
      <button data-mode="pdf">仅PDF</button>
      <button data-mode="text">仅文字</button>
    </div>
    <button id="btn-spread" class="icon-btn" title="PDF 双页摊开">📖</button>
    <button id="btn-sync" class="icon-btn" title="同步滚动">⇅</button>
    <span id="plugin-toolbar"></span>   <!-- 插件工具栏插槽 -->
    <button id="btn-settings" class="icon-btn" title="设置 / 插件">⚙</button>
    <button id="btn-import" class="icon-btn" title="导入 .s2e 电子书包">⬆ 导入</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="library-panel">
      <div class="panel-head">
        <span class="panel-title">书库</span>
        <span class="panel-actions">
          <button id="btn-import-lib" class="mini">导入电子书</button>
          <button id="btn-new-folder" class="mini">＋文件夹</button>
          <button id="btn-batch" class="mini">批量</button>
        </span>
      </div>
      <div id="library-tree" class="panel-body"></div>
    </div>
    <div id="toc-panel">
      <div class="panel-head">
        <span class="panel-title">目录</span>
        <span class="seg" id="toc-tabs">
          <button data-tt="toc" class="active">目录</button>
        </span>
      </div>
      <div id="toc-list" class="panel-body"></div>
    </div>
  </aside>

  <main id="workspace"></main>
</div>

<div id="fn-tooltip"></div>
<div id="toast"></div>
<div id="settings-dialog" hidden>
  <div class="sd-head">
    <span>设置 / 插件</span>
    <button id="sd-close" class="mini">✕</button>
  </div>
  <div id="sd-sections"></div>
</div>
<input type="file" id="import-input" accept=".s2e,.zip" multiple hidden>

<script type="module" src="/src/main.js"></script>
</body>
</html>
