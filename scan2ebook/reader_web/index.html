<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>scan2ebook 阅读器</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="split" data-eyecare="off">

<header id="topbar">
  <button id="btn-library" class="icon-btn" title="书库">📚</button>
  <div id="tabs"></div>
  <div id="topbar-right">
    <div id="view-modes" class="seg">
      <button data-mode="split" class="active">双栏</button>
      <button data-mode="pdf">仅PDF</button>
      <button data-mode="text">仅文字</button>
    </div>
    <button id="btn-spread" class="icon-btn" title="PDF 双页摊开">📖</button>
    <button id="btn-sync" class="icon-btn" title="同步滚动">⇅</button>
    <button id="btn-bookmark" class="icon-btn" title="当前页加书签">🔖</button>
    <div id="search-wrap">
      <input id="search-input" type="search" placeholder="搜索正文…" autocomplete="off">
      <span id="search-info"></span>
      <button id="search-prev" class="mini" title="上一个">▲</button>
      <button id="search-next" class="mini" title="下一个">▼</button>
    </div>
    <button id="btn-eyecare" class="icon-btn" title="护眼/阅读环境">👁</button>
    <button id="btn-import" class="icon-btn" title="导入 .s2e 电子书包">⬆</button>
  </div>
</header>

<div id="layout">
  <aside id="sidebar">
    <div id="library-panel">
      <div class="panel-head">
        <span class="panel-title">书库</span>
        <span class="panel-actions">
          <button id="btn-new-folder" class="mini">＋文件夹</button>
          <button id="btn-batch" class="mini">批量</button>
        </span>
      </div>
      <div id="library-tree" class="panel-body"></div>
    </div>
    <div id="toc-panel">
      <div class="panel-head">
        <span class="panel-title">目录</span>
        <span class="seg" id="toc-tabs">
          <button data-tt="toc" class="active">目录</button>
          <button data-tt="bm">书签</button>
        </span>
      </div>
      <div id="toc-list" class="panel-body"></div>
      <div id="bm-list" class="panel-body" hidden></div>
    </div>
  </aside>

  <main id="workspace"></main>
</div>

<div id="fn-tooltip"></div>
<div id="toast"></div>
<div id="eyecare-panel" hidden>
  <div class="ec-title">阅读环境</div>
  <div class="ec-row"><label>护眼模式</label><button id="ec-eye" class="toggle">关</button></div>
  <div class="ec-row"><label>深色模式</label><button id="ec-dark" class="toggle">关</button></div>
  <div class="ec-row"><label>亮度</label><input id="ec-brightness" type="range" min="70" max="110" value="100"></div>
  <div class="ec-row"><label>色温（暖）</label><input id="ec-warmth" type="range" min="0" max="100" value="0"></div>
  <div class="ec-row"><label>字号</label><input id="ec-font" type="range" min="13" max="26" value="17"></div>
  <div class="ec-row"><label>行距</label><input id="ec-lineh" type="range" min="1.4" max="2.4" value="1.9" step="0.05"></div>
  <div class="ec-row"><label>阅读宽度</label><input id="ec-width" type="range" min="28" max="52" value="42"></div>
  <button id="ec-reset" class="mini">恢复默认</button>
</div>
<input type="file" id="import-input" accept=".s2e,.zip" multiple hidden>

<script src="lib/jszip.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdf.worker.min.js';</script>
<script type="module" src="app.js"></script>
</body>
</html>
