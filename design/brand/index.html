<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan2Ebook · 翻页图形标</title>
<link rel="icon" type="image/svg+xml" href="a-original/app-icon.svg">
<style>
:root{--bg:#f3f5f0;--surface:#fff;--ink:#20251e;--muted:#737b6b;--line:#dce2d5;--soft:#f7f8f5;--lime:#d9f458}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
body[data-theme=dark]{--bg:#151912;--surface:#22271e;--ink:#f4f6ed;--muted:#a6b29c;--line:#3c4633;--soft:#2b3225}
main{max-width:1320px;margin:auto;padding:42px 52px 30px}header{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px}h1{font-size:26px;font-weight:650;letter-spacing:-.8px;margin:0}header p{margin:9px 0 0;color:var(--muted);font-size:13px}.themes{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px}.themes button{font:inherit;font-size:12px;padding:8px 15px;border:0;border-radius:99px;color:var(--muted);background:transparent;cursor:pointer}.themes button[aria-pressed=true]{background:var(--ink);color:var(--surface)}button:focus-visible,a:focus-visible{outline:3px solid #93af36;outline-offset:4px}
.hero-grid{display:grid;grid-template-columns:1.8fr 1fr;gap:20px}.panel{position:relative;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}.label{font-size:11px;color:var(--muted);margin:0;position:absolute;top:23px;left:25px}.lockup-stage{height:330px;display:flex;align-items:center;justify-content:center}.lockup-stage img{display:block;width:82%;max-width:530px;height:auto}.icon-stage{height:330px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-direction:column}.icon-stage img{width:230px;height:230px;filter:drop-shadow(0 8px 8px #1820090b)}.app-name{font-size:12px;color:var(--muted);margin-top:3px}
.detail-grid{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:20px;margin-top:20px}.detail{height:200px;display:flex;align-items:center;justify-content:center;padding-top:20px}.standalone{width:128px;height:128px}.mono-stage{display:flex;gap:10px}.mono{display:flex;align-items:center;justify-content:center;width:98px;height:98px;border-radius:15px;background:#f7f8f5}.mono img{width:77px;height:77px}.mono.dark{background:#20251e}.sizes{display:flex;align-items:end;gap:25px}.sizes div{text-align:center}.sizes img{display:block;margin:auto}.sizes small{display:block;font-size:10px;color:var(--muted);margin-top:9px}.sizes .app48{width:48px;height:48px}.sizes .app32{width:32px;height:32px}.sizes .app16{width:16px;height:16px}footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px;color:var(--muted);font-size:11px;line-height:1.6}.downloads{display:flex;gap:18px;flex-wrap:wrap}.downloads a{color:inherit;text-decoration:none}.downloads a:hover{color:var(--ink)}
@media(max-width:850px){main{padding:28px 24px}.hero-grid{grid-template-columns:1.5fr 1fr}.lockup-stage,.icon-stage{height:280px}.icon-stage img{width:190px;height:190px}.detail-grid{gap:12px}.mono{width:74px;height:74px}.mono img{width:60px;height:60px}.sizes{gap:13px}footer{align-items:start;flex-direction:column;gap:10px}}
@media(max-width:580px){main{padding:25px 18px}header{align-items:start}h1{font-size:21px}header p{font-size:12px;max-width:210px;line-height:1.6}.themes button{padding:6px 9px}.hero-grid{grid-template-columns:1fr;gap:14px}.lockup-stage{height:245px}.icon-stage{height:260px}.detail-grid{grid-template-columns:1fr;gap:14px;margin-top:14px}.detail{height:180px}}
</style>
</head>
<body data-theme="light">
<main>
<header><div><h1>Scan2Ebook 图形标</h1><p>翻开的书，抬起的一页，和保留下来的 s2e.</p></div><div class="themes" role="group" aria-label="预览配色"><button aria-pressed="true" data-theme="light">浅色</button><button aria-pressed="false" data-theme="dark">深色</button></div></header>
<section class="hero-grid" aria-label="Logo 与应用图标">
<div class="panel lockup-stage"><p class="label">图形 + 字标</p><img data-themed="logo" src="a-original/logo.svg" alt="翻页图形与原 s2e. 字标组合"></div>
<div class="panel icon-stage"><p class="label">macOS App</p><img src="a-original/app-icon-1024.png" alt="青柠色底的翻页应用图标"><span class="app-name">Scan2Ebook</span></div>
</section>
<section class="detail-grid" aria-label="独立图形与小尺寸">
<div class="panel detail"><p class="label">独立图形</p><img class="standalone" data-themed="symbol" src="a-original/symbol.svg" alt="翻开的书与抬起的页角"></div>
<div class="panel detail"><p class="label">单色</p><div class="mono-stage"><div class="mono"><img src="a-original/symbol-mono.svg" alt="单色深墨绿图形"></div><div class="mono dark"><img src="a-original/symbol-white.svg" alt="单色反白图形"></div></div></div>
<div class="panel detail"><p class="label">小尺寸图标</p><div class="sizes"><div><img class="app48" src="a-original/app-icon-64.png" alt="48 像素应用图标"><small>48 px</small></div><div><img class="app32" src="a-original/app-icon-32.png" alt="32 像素应用图标"><small>32 px</small></div><div><img class="app16" src="a-original/app-icon-16.png" alt="16 像素应用图标"><small>16 px</small></div></div></div>
</section>
<footer><span>组合标用于界面；图形单独用于 App 与浏览器页签。</span><div class="downloads"><a href="a-original/logo.svg" download>组合标 SVG ↗</a><a href="a-original/symbol.svg" download>图形 SVG ↗</a><a href="a-original/app-icon.svg" download>应用图标 SVG ↗</a></div></footer>
</main>
<script>
for(const button of document.querySelectorAll('.themes button'))button.addEventListener('click',()=>{const theme=button.dataset.theme;document.body.dataset.theme=theme;for(const item of document.querySelectorAll('.themes button'))item.setAttribute('aria-pressed',String(item===button));for(const image of document.querySelectorAll('[data-themed]'))image.src='a-original/'+image.dataset.themed+(theme==='dark'?'-inverse':'')+'.svg'});
</script>
</body>
</html>
